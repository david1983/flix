<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Flix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e5484d'/><path d='M12 9l12 7-12 7z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="nav" id="nav">
  <a class="logo" id="logo" href="#/">FLIX</a>
  <a class="kids-logo" id="kids-logo" href="#/kids" aria-label="KIDSFLIX home"><span>K</span><span>I</span><span>D</span><span>S</span><span>F</span><span>L</span><span>I</span><span>X</span></a>
  <nav class="links">
    <a href="#/" data-route="home">Home</a>
    <a href="#/movies" data-route="movies">Movies</a>
    <a href="#/shows" data-route="shows">TV Shows</a>
    <a href="#/collections" data-route="collections">Collections</a>
    <a href="#/discover" data-route="discover">Discover</a>
    <a href="#/downloads" data-route="downloads">Downloads</a>
    <a href="#/settings" data-route="settings">Settings</a>
    <a href="#/kids" class="kids-link" id="kids-link">KIDSFLIX</a>
  </nav>
  <div class="nav-right">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Titles, shows, years…" autocomplete="off">
    </label>
    <button class="kids-exit" id="kids-exit">Exit</button>
    <button class="icon-btn" id="rescan" title="Rescan library" aria-label="Rescan library">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="view"></main>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="player" id="player" hidden>
  <video id="video" playsinline preload="auto"></video>
  <div class="subs" id="subs"></div>
  <div class="spinner" id="spinner" hidden></div>
  <div class="up-next" id="upnext" hidden></div>
  <div class="p-top">
    <button class="p-btn" id="p-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="p-title"><strong id="p-title"></strong><span id="p-sub"></span></div>
    <span class="p-mode" id="p-mode"></span>
  </div>
  <div class="p-center" id="p-center"></div>
  <div class="p-bottom">
    <div class="seek" id="seek">
      <div class="seek-track"><div class="seek-buf" id="seek-buf"></div><div class="seek-fill" id="seek-fill"></div><div class="seek-knob" id="seek-knob"></div></div>
      <div class="seek-tip" id="seek-tip">0:00</div>
    </div>
    <div class="p-row">
      <button class="p-btn" id="p-play" aria-label="Play/Pause"></button>
      <button class="p-btn" id="p-rew" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><text x="12" y="15.5" text-anchor="middle" font-size="7" stroke="none" fill="currentColor">10</text></svg></button>
      <button class="p-btn" id="p-fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/><text x="12" y="15.5" text-anchor="middle" font-size="7" stroke="none" fill="currentColor">10</text></svg></button>
      <div class="vol">
        <button class="p-btn" id="p-mute" aria-label="Mute"></button>
        <input type="range" id="p-vol" min="0" max="1" step="0.02" aria-label="Volume">
      </div>
      <span class="p-time" id="p-time">0:00 / 0:00</span>
      <span class="grow"></span>
      <button class="p-btn" id="p-next" aria-label="Next episode" hidden><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z" fill="currentColor"/><path d="M18 5v14"/></svg></button>
      <div class="menu-anchor">
        <button class="p-btn" id="p-cc" aria-label="Audio and subtitles"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 11h4M13 11h4M7 15h7M16 15h1"/></svg></button>
        <div class="menu" id="menu-cc" hidden></div>
      </div>
      <div class="menu-anchor">
        <button class="p-btn" id="p-q" aria-label="Quality"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
        <div class="menu" id="menu-q" hidden></div>
      </div>
      <button class="p-btn" id="p-fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
